<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMOS Auto Tool</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: ui-monospace, monospace; background: #11111b; color: #cdd6f4; padding: 20px; max-width: 900px; margin: auto; }
    h1 { color: #89b4fa; font-size: 22px; }
    .card { background: #1e1e2e; border: 1px solid #45475a; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #a6adc8; margin: 10px 0 5px; }
    input[type="text"], select { width: 100%; padding: 8px 12px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 6px; font-family: inherit; font-size: 13px; }
    input[type="checkbox"] { margin-right: 6px; }
    button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 14px; }
    button.primary { background: #a6e3a1; color: #11111b; width: 100%; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #logs { height: 400px; overflow-y: auto; background: #181825; padding: 12px; border-radius: 6px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
    #logs div { padding: 1px 0; }
    #result { font-size: 15px; color: #a6e3a1; font-weight: bold; padding: 12px; background: #181825; border-radius: 6px; word-break: break-all; display: none; }
    .err { color: #f38ba8; }
    .ok { color: #a6e3a1; }
    .warn { color: #f9e2af; }
    .step { color: #89b4fa; font-weight: bold; }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<h1>🌐 VMOS Auto Tool (Chromium)</h1>

<div class="card">
    <label>Browser</label>
    <select id="browser">
        <option value="auto">Auto (Chrome ưu tiên)</option>
        <option value="chrome">Chrome</option>
        <option value="edge">Edge</option>
    </select>

    <label>Browser Path (để trống → auto-detect)</label>
    <input type="text" id="browserPath" placeholder="C:\Program Files\Google\Chrome\Application\chrome.exe">

    <label><input type="checkbox" id="headless"> Headless (⚠️ dễ bị Cloudflare chặn)</label>
    <label><input type="checkbox" id="useWarp"> Rotate IP qua WARP</label>

    <br>
    <button class="primary" id="startBtn">🚀 Tạo Account</button>
</div>

<div class="card">
    <label>Tiến trình:</label>
    <div id="logs"></div>
</div>

<div class="card">
    <label>Kết quả:</label>
    <div id="result"></div>
</div>

<script src="app.js"></script>
</body>
</html>
